<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Browser — Second Brain</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0d1117;--surface:#161b22;--border:rgba(255,255,255,0.06);--text:#e6edf3;--text-dim:#7d8590;--accent:#8b5cf6;--sidebar-w:56px;--topbar-h:52px}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
        .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100%;background:rgba(13,17,23,0.95);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;z-index:100}
        .sidebar-top{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
        .sidebar-bottom{display:flex;flex-direction:column;align-items:center;gap:4px}
        .sb-logo{width:32px;height:32px;margin-bottom:12px;background:linear-gradient(135deg,#8b5cf6,#a78bfa,#c4b5fd);clip-path:polygon(50% 0%,85% 25%,85% 75%,50% 100%,15% 75%,15% 25%)}
        .sb-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);transition:all 0.2s;border:none;background:none;position:relative;text-decoration:none}
        .sb-icon:hover{color:var(--text);background:rgba(255,255,255,0.04)}
        .sb-icon.active{color:var(--accent)}
        .sb-icon.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0}
        .sb-divider{width:24px;height:1px;background:var(--border);margin:6px 0}
        .sb-profile{width:36px;height:36px;border-radius:50%;position:relative;cursor:pointer;margin-top:8px}
        .sb-profile::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,#8b5cf6,#a78bfa,#8b5cf6);z-index:-1;animation:spin 4s linear infinite}
        .sb-profile-inner{width:100%;height:100%;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px}
        .sb-profile-label{font-size:8px;font-weight:700;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;text-align:center}
        @keyframes spin{to{transform:rotate(360deg)}}
        .topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:rgba(13,17,23,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:90}
        .topbar-tabs{display:flex;gap:24px;margin-right:24px}
        .tab-btn{font-size:14px;font-weight:600;color:var(--text-dim);cursor:pointer;background:none;border:none;padding:6px 0;position:relative;text-decoration:none}
        .tab-btn.active{color:var(--text)}
        .tab-btn.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--text);border-radius:1px}
        
        .search-box { flex: 1; max-width: 320px; position: relative; }
        .search-box input { width: 100%; padding: 7px 12px 7px 32px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; outline: none; }
        .search-box input:focus { border-color: rgba(139,92,246,0.4); }
        .search-box input::placeholder { color: var(--text-dim); }
        .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-dim); }
        .topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
        .topbar-time{font-size:12px;color:var(--text-dim);font-weight:500;letter-spacing:0.04em}
        .layout{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);display:flex;height:calc(100vh - var(--topbar-h));overflow:hidden}
        .left-panel{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
        .panel-header{padding:12px 16px;border-bottom:1px solid var(--border)}
        .panel-header h2{font-size:14px;font-weight:600;margin-bottom:8px}
        .search-input{width:100%;padding:7px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
        .search-input:focus{border-color:var(--accent)}
        .tree{flex:1;overflow-y:auto;padding:8px 0}
        .tree-item{display:flex;align-items:center;gap:6px;padding:6px 16px;cursor:pointer;font-size:13px;color:var(--text-dim);transition:all 0.1s}
        .tree-item:hover{background:rgba(255,255,255,0.03);color:var(--text)}
        .tree-item.active{background:rgba(139,92,246,0.08);color:var(--accent)}
        .tree-item .icon{width:16px;text-align:center;font-size:12px}
        .tree-item .count{margin-left:auto;font-size:10px;color:var(--text-dim);background:rgba(255,255,255,0.04);padding:1px 6px;border-radius:8px}
        .tree-group{padding:4px 0}
        .tree-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);padding:8px 16px 4px}
        .right-panel{flex:1;overflow-y:auto;padding:20px 24px}
        .detail-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}
        .detail-title{font-size:20px;font-weight:700}
        .detail-meta{font-size:12px;color:var(--text-dim);margin-top:4px}
        .detail-content{font-size:13px;line-height:1.7;color:var(--text-dim);margin-bottom:20px;white-space:pre-wrap}
        .detail-tags{display:flex;flex-wrap:wrap;gap:6px}
        .detail-tag{padding:4px 10px;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);border-radius:6px;font-size:11px;color:var(--accent)}
        .related-list{margin-top:20px}
        .related-list h3{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:10px}
        .related-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all 0.15s;font-size:13px}
        .related-item:hover{background:rgba(255,255,255,0.04);border-color:rgba(139,92,246,0.2)}
    
        .chat-panel { position: fixed; top: var(--topbar-h); right: -400px; width: 400px; bottom: 0; background: rgba(13,17,23,0.95); backdrop-filter: blur(16px); border-left: 1px solid var(--border); z-index: 90; display: flex; flex-direction: column; transition: right 0.3s; }
        .chat-panel.open { right: 0; }
        .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { font-size: 13px; font-weight: 600; }
        .chat-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 13px; line-height: 1.5; padding: 8px 12px; border-radius: 8px; max-width: 90%; }
        .chat-msg.user { background: rgba(139,92,246,0.15); align-self: flex-end; border: 1px solid rgba(139,92,246,0.2); }
        .chat-msg.assistant { background: rgba(255,255,255,0.03); align-self: flex-start; border: 1px solid var(--border); }
        .chat-input-area { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; }
        .chat-input-area button { padding: 8px 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-top">
            <a href="/" class="sb-logo" style="text-decoration:none" title="Second Brain"></a>
            <a href="/" class="sb-icon" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
            <a href="/hub" class="sb-icon" aria-label="Hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></a>
            <a href="/knowledge" class="sb-icon" aria-label="Knowledge Web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><line x1="8.5" y1="6" x2="15.5" y2="6"/><line x1="6" y1="8.5" x2="6" y2="15.5"/></svg></a>
            <a href="/graph" class="sb-icon" aria-label="Graph View"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><line x1="8.5" y1="6" x2="15.5" y2="6"/><line x1="6" y1="8.5" x2="6" y2="15.5"/><line x1="18" y1="8.5" x2="18" y2="15.5"/><line x1="8.5" y1="18" x2="15.5" y2="18"/></svg></a>
            <a href="/calendar" class="sb-icon" aria-label="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><rect x="7" y="14" width="3" height="3" rx="0.5"/></svg></a>
            <a href="/skills" class="sb-icon" aria-label="Skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></a>
            <a href="/browser" class="sb-icon active" aria-label="Browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></a>
            <a href="/colleagues" class="sb-icon" aria-label="Colleagues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></a>
            <div class="sb-divider"></div>
            <a href="/settings" class="sb-icon" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
        </div>
        <div class="sidebar-bottom">
            <div class="sb-profile" title="AI Assistant"><div class="sb-profile-inner">🔮</div></div>
            <div class="sb-profile-label">AI<br>ASSISTANT</div>
        </div>
    </nav>

    <div class="topbar">
        <div class="topbar-tabs">
            <a href="/" class="tab-btn">Home</a>
            <a href="/knowledge" class="tab-btn">Knowledge Web</a>
            <a href="/graph" class="tab-btn">Graph View</a>
            <a href="/hub" class="tab-btn">Personal Hub</a>
            <a href="/settings" class="tab-btn">Settings</a>
        </div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search knowledge web..." aria-label="Search" oninput="handleSearch(this.value)">
        </div>
        <div class="topbar-right"><span class="topbar-time" id="topTime"></span>
                        <button onclick="toggleChat()" title="AI Chat" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-dim);cursor:pointer;font-size:15px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:all 0.15s">💬</button></div>
    </div>

    <div class="layout">
        <div class="left-panel">
            <div class="panel-header">
                <h2>Knowledge Browser</h2>
                <input type="text" class="search-input" id="searchInput" placeholder="Search topics..." oninput="filterTree(this.value)">
            </div>
            <div class="tree" id="tree"></div>
        </div>
        <div class="right-panel" id="rightPanel">
            <div style="text-align:center;color:var(--text-dim);padding:60px 20px">
                <div style="font-size:40px;margin-bottom:12px">📂</div>
                <div style="font-size:14px;font-weight:500;margin-bottom:4px">Select an item</div>
                <div style="font-size:12px">Click any item in the tree to view details</div>
            </div>
        </div>
    </div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <h3>💬 AI Chat</h3>
            <button class="chat-close" onclick="toggleChat()">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="text-align:center;color:var(--text-dim);padding:20px;font-size:12px;">
                Ask me anything about your knowledge base.<br>I search your memories and use Gemini to answer.
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask about your memories..." onkeydown="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()">Send</button>
        </div>
    </div>

    <script>
    const API_URL=window.location.origin+'/api/v1';
    let apiKey=localStorage.getItem('brain_api_key')||'';
    let allItems=[];

        // ── Search ──
    var searchTimer;
    function handleSearch(q) {
        clearTimeout(searchTimer);
        if (!q.trim()) return;
        searchTimer = setTimeout(function() {
            window.location.href = '/browser?search=' + encodeURIComponent(q);
        }, 800);
    }

    function startTimeClock(){const u=()=>{const n=new Date(),mo=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];document.getElementById('topTime').textContent=n.getDate().toString().padStart(2,'0')+' '+mo[n.getMonth()]+' '+n.getFullYear()+' | '+n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+' PST'};u();setInterval(u,30000)}

    async function loadData(){
        if(!apiKey){apiKey=prompt('Enter API key:');if(!apiKey)return;localStorage.setItem('brain_api_key',apiKey)}
        try{
            const res=await fetch(API_URL+'/items?limit=200',{headers:{'X-API-Key':apiKey}});
            if(!res.ok)throw new Error();
            allItems=await res.json();
            buildTree();
        }catch(e){document.getElementById('tree').innerHTML='<div style="color:#f87171;padding:16px">Failed to load</div>'}
    }

    function buildTree(filter){
        const tree=document.getElementById('tree');
        const q=(filter||'').toLowerCase();
        // Group by type
        const groups={};
        allItems.forEach(item=>{
            if(q&&!item.title.toLowerCase().includes(q)&&!item.content.toLowerCase().includes(q))return;
            const tags=Array.isArray(item.tags)?item.tags:JSON.parse(item.tags||'[]');
            const isRepo=tags.includes('github')||tags.includes('graphify');
            const group=isRepo?'Repositories':item.item_type==='note'?'Topics':item.item_type==='task'?'Tasks':'Bookmarks';
            if(!groups[group])groups[group]=[];
            groups[group].push(item);
        });
        const ICONS={Topics:'📄',Repositories:'📦',Tasks:'✅',Bookmarks:'🔖'};
        tree.innerHTML=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([group,items])=>
            '<div class="tree-group">'+
                '<div class="tree-group-label">'+ICONS[group]+' '+group+'</div>'+
                items.map(item=>
                    '<div class="tree-item" onclick="showDetail('+item.id+')" data-id="'+item.id+'">'+
                        '<span class="icon">'+ICONS[group]+'</span>'+
                        '<span>'+esc(item.title.substring(0,35))+'</span>'+
                        '<span class="count">'+item.item_type+'</span>'+
                    '</div>'
                ).join('')+
            '</div>'
        ).join('');
    }

    function filterTree(q){buildTree(q)}

    async function showDetail(id){
        document.querySelectorAll('.tree-item').forEach(i=>i.classList.remove('active'));
        document.querySelector('.tree-item[data-id="'+id+'"]')?.classList.add('active');
        try{
            const res=await fetch(API_URL+'/items/'+id,{headers:{'X-API-Key':apiKey}});
            if(!res.ok)throw new Error();
            const item=await res.json();
            const tags=Array.isArray(item.tags)?item.tags:JSON.parse(item.tags||'[]');
            const isRepo=tags.includes('github')||tags.includes('graphify');
            document.getElementById('rightPanel').innerHTML=
                '<div class="detail-header">'+
                    '<div><div class="detail-title">'+esc(item.title)+'</div>'+
                    '<div class="detail-meta">'+item.item_type+(isRepo?' · <a href="https://github.com/'+item.title+'" target="_blank" style="color:var(--accent)">GitHub</a>':'')+'</div></div>'+
                '</div>'+
                '<div class="detail-content">'+esc(item.content.substring(0,1000))+'</div>'+
                '<div class="detail-tags">'+tags.map(t=>'<span class="detail-tag">'+esc(t)+'</span>').join('')+'</div>'+
                '<div class="related-list"><h3>Related Items</h3>'+
                allItems.filter(i=>i.id!==item.id).slice(0,5).map(i=>
                    '<div class="related-item" onclick="showDetail('+i.id+')">'+esc(i.title.substring(0,40))+'<span style="color:var(--text-dim);font-size:11px">'+i.item_type+'</span></div>'
                ).join('')+'</div>';
        }catch(e){}
    }

    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    startTimeClock();loadData();
    // Handle ?search= URL parameter
    var urlParams = new URLSearchParams(window.location.search);
    var searchQ = urlParams.get('search');
    if (searchQ) {
        var searchEl = document.getElementById('searchInput');
        if (searchEl) { searchEl.value = searchQ; filterTree(searchQ); }
    }
    
    var chatHistory = JSON.parse(localStorage.getItem('brain_chat_history') || '[]'); if (!Array.isArray(chatHistory)) chatHistory = [];
    function toggleChat() { document.getElementById('chatPanel').classList.toggle('open'); }
    async function sendChat() {
        var input = document.getElementById('chatInput'), msg = input.value.trim();
        if (!msg) return; input.value = '';
        var ml = document.getElementById('chatMessages');
        ml.innerHTML += '<div class="chat-msg user">' + esc(msg) + '</div>';
        var tid = 't-' + Date.now();
        ml.innerHTML += '<div class="chat-msg assistant" id="' + tid + '">Thinking...</div>';
        ml.scrollTop = ml.scrollHeight;
        try {
            var _apiKey = localStorage.getItem('brain_api_key') || '';
            var _headers = {'Content-Type': 'application/json'};
            if (_apiKey) _headers['X-API-Key'] = _apiKey;
            var r = await fetch(window.location.origin + '/api/v1/chat', { method: 'POST', headers: _headers, body: JSON.stringify({ message: msg, history: chatHistory }) });
            document.getElementById(tid).innerHTML = esc(r.reply);
            chatHistory.push({ role: 'user', parts: [msg] }); chatHistory.push({ role: 'model', parts: [r.reply] });
            if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
            localStorage.setItem('brain_chat_history', JSON.stringify(chatHistory));
        } catch(e) { document.getElementById(tid).innerHTML = '<span style="color:#f87171">' + esc(e.message) + '</span>'; }
        ml.scrollTop = ml.scrollHeight;
    }

    
    document.addEventListener('click', function(e) {
        var cp = document.getElementById('chatPanel');
        if (cp && cp.classList.contains('open') && !e.target.closest('.chat-panel') && !e.target.closest('[onclick*="toggleChat"]')) {
            cp.classList.remove('open');
        }
    });
    </script>
</body>
</html>
