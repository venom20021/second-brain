<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Web — Second Brain</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #0d1117; --surface: #161b22; --border: rgba(255,255,255,0.06); --text: #e6edf3; --text-dim: #7d8590; --accent: #8b5cf6; --sidebar-w: 56px; --topbar-h: 52px; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100%; background: rgba(13,17,23,0.95); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 12px 0; z-index: 100; }
        .sidebar-top { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .sidebar-bottom { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .sb-logo { width: 32px; height: 32px; margin-bottom: 12px; cursor: pointer; background: linear-gradient(135deg, #8b5cf6, #a78bfa, #c4b5fd); clip-path: polygon(50% 0%, 85% 25%, 85% 75%, 50% 100%, 15% 75%, 15% 25%); transition: filter 0.3s; }
        .sb-logo:hover { filter: brightness(1.3) drop-shadow(0 0 10px rgba(139,92,246,0.6)); }
        .sb-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dim); transition: all 0.2s; border: none; background: none; position: relative; text-decoration: none; }
        .sb-icon:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .sb-icon.active { color: var(--accent); }
        .sb-icon.active::before { content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; background: var(--accent); border-radius: 0 3px 3px 0; }
        .sb-divider { width: 24px; height: 1px; background: var(--border); margin: 6px 0; }
        .sb-profile { width: 36px; height: 36px; border-radius: 50%; position: relative; cursor: pointer; margin-top: 8px; }
        .sb-profile::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from 0deg, #8b5cf6, #a78bfa, #8b5cf6); z-index: -1; animation: spin 4s linear infinite; }
        .sb-profile-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .sb-profile-label { font-size: 8px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; text-align: center; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .topbar { position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: var(--topbar-h); background: rgba(13,17,23,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 90; }
        .topbar-tabs { display: flex; gap: 24px; margin-right: 24px; }
        .tab-btn { font-size: 14px; font-weight: 600; color: var(--text-dim); cursor: pointer; background: none; border: none; padding: 6px 0; position: relative; transition: color 0.2s; text-decoration: none; }
        .tab-btn.active { color: var(--text); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: var(--text); border-radius: 1px; }
        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .topbar-time { font-size: 12px; color: var(--text-dim); font-weight: 500; letter-spacing: 0.04em; white-space: nowrap; }

        #graphCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: grab; }
        #graphCanvas:active { cursor: grabbing; }

        .minimap { position: fixed; bottom: 16px; right: 16px; width: 160px; height: 110px; background: rgba(13,17,23,0.9); border: 1px solid var(--border); border-radius: 8px; z-index: 80; overflow: hidden; }
        .minimap canvas { width: 100%; height: 100%; }

        .controls { position: fixed; bottom: 16px; left: calc(var(--sidebar-w) + 16px); display: flex; gap: 6px; z-index: 80; }
        .ctrl-btn { width: 34px; height: 34px; background: rgba(22,27,34,0.9); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.15s; }
        .ctrl-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

        .auth-overlay { position: fixed; inset: 0; background: rgba(13,17,23,0.95); backdrop-filter: blur(20px); z-index: 500; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 360px; text-align: center; }
        .auth-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .auth-card p { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
        .auth-card input { width: 100%; padding: 9px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; margin-bottom: 12px; font-family: monospace; }
        .auth-card input:focus { border-color: var(--accent); }
        .auth-card button { width: 100%; padding: 9px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
        #authError { color: #f87171; font-size: 11px; margin-top: 8px; display: none; }

        .toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-16px); padding: 7px 14px; background: rgba(22,27,34,0.95); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; z-index: 300; opacity: 0; transition: all 0.2s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .side-panel { position: fixed; top: var(--topbar-h); right: -400px; width: 400px; bottom: 0; background: rgba(13,17,23,0.97); backdrop-filter: blur(16px); border-left: 1px solid var(--border); z-index: 90; overflow-y: auto; transition: right 0.3s ease; display: flex; flex-direction: column; }
        .side-panel.open { right: 0; }
        .panel-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; }
        .panel-tab { padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; }
        .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .panel-tab:hover:not(.active) { color: var(--text); }
        .panel-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .panel-section:last-child { border-bottom: none; }
        .panel-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 10px; }
        .panel-item-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
        .panel-item-type { display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
        .panel-item-content { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
        .panel-item-content.truncated { max-height: 120px; overflow: hidden; position: relative; }
        .panel-item-content.truncated::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: linear-gradient(transparent, rgba(13,17,23,0.97)); }
        .panel-expand-btn { font-size: 11px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 4px 0; margin-top: 4px; }
        .panel-tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .panel-tag { font-size: 10px; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; transition: all 0.15s; }
        .panel-tag:hover { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.3); color: var(--accent); }
        .panel-meta-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 11px; }
        .panel-meta-label { color: var(--text-dim); }
        .panel-meta-value { color: var(--text); font-weight: 500; }
        .panel-actions { display: flex; gap: 8px; }
        .panel-action-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text-dim); font-size: 11px; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.15s; text-decoration: none; display: block; }
        .panel-action-btn:hover { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.3); color: var(--accent); }
        .panel-sections-list { }
        .panel-section-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background 0.15s; }
        .panel-section-item:hover { background: rgba(255,255,255,0.04); }
        .panel-section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .panel-section-count { margin-left: auto; font-size: 10px; color: var(--text-dim); background: rgba(255,255,255,0.04); padding: 1px 6px; border-radius: 4px; }
        .panel-empty { text-align: center; padding: 30px 16px; color: var(--text-dim); font-size: 12px; }
        .panel-empty .icon { font-size: 28px; margin-bottom: 8px; }
    </style>
</head>

    <script>
    const API_URL = window.location.origin + '/api/v1';
    let apiKey = localStorage.getItem('brain_api_key') || '';
    let allItems = [];
    let graphNodes = [], graphEdges = [], graphSections = [];
    let hoveredNode = null, dragNode = null, isDragging = false, didDrag = false;
    let mouseDownPos = null, lastMouse = {x:0,y:0};
    const cfg = { zoom:1, panX:0, panY:0, orbitalForce:0.006, repulsion:2000, linkDist:160, damping:0.92 };
    const HUB_COLORS = { topics:{main:'#4ade80',bg:'#4ade80'}, repos:{main:'#a78bfa',bg:'#a78bfa'}, skills:{main:'#fbbf24',bg:'#fbbf24'} };
    let kRotSpeed=1, kSpread=1, kGlow=1;

    // Auth
    function showAuth(){document.getElementById('authOverlay').style.display='flex'}
    function hideAuth(){document.getElementById('authOverlay').style.display='none'}
    document.getElementById('authConnectBtn').addEventListener('click',async function(){
        var k=document.getElementById('authKeyInput').value.trim();if(!k)return;
        apiKey=k;localStorage.setItem('brain_api_key',k);
        try{var r=await fetch(API_URL+'/stats',{headers:{'X-API-Key':apiKey}});if(!r.ok)throw new Error();hideAuth();loadData();}
        catch(e){document.getElementById('authError').textContent='Invalid key.';document.getElementById('authError').style.display='block';apiKey='';localStorage.removeItem('brain_api_key');}
    });
    document.getElementById('authKeyInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('authConnectBtn').click()});

    async function checkAuth(){
        try{var s=await fetch(API_URL.replace('/api/v1','')+'/api/v1/auth/status').then(function(r){return r.json()});
        if(s.auth_enabled&&!apiKey){showAuth();return;}
        if(apiKey){var r=await fetch(API_URL+'/stats',{headers:{'X-API-Key':apiKey}});if(!r.ok){apiKey='';localStorage.removeItem('brain_api_key');showAuth();return;}}
        hideAuth();loadData();}catch(e){showAuth();}
    }

    async function apiFetch(path,opts){
        opts=opts||{};
        var h={'Content-Type':'application/json'};
        if(apiKey)h['X-API-Key']=apiKey;
        var body=opts.body?JSON.stringify(opts.body):undefined;
        var r=await fetch(API_URL+path,Object.assign({},opts,{headers:h,body:body}));
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.json();
    }

    async function loadData(){
        try{
            allItems = await apiFetch('/items?limit=200');
            setupCanvas();
            buildGraph();
            fitAll();
            renderSectionList();
            startClock();
        }catch(e){console.error('loadData error:',e);}
    }

    function setupCanvas(){
        var canvas=document.getElementById('graphCanvas');
        var dpr=window.devicePixelRatio||1;
        canvas.width=window.innerWidth*dpr;
        canvas.height=window.innerHeight*dpr;
        canvas.style.width=window.innerWidth+'px';
        canvas.style.height=window.innerHeight+'px';
        canvas.getContext('2d').scale(dpr,dpr);
    }

    function buildGraph(){
        graphNodes=[];graphEdges=[];
        var canvas=document.getElementById('graphCanvas');
        var w=window.innerWidth,h=window.innerHeight;
        var cx=w/2,cy=h/2;
        var topics=[],repos=[],skillTags={};
        allItems.forEach(function(item){
            var tags=Array.isArray(item.tags)?item.tags:JSON.parse(item.tags||'[]');
            if(tags.indexOf('graphify')>=0)repos.push(item);else topics.push(item);
            tags.forEach(function(t){skillTags[t]=(skillTags[t]||0)+1;});
        });
        var topSkills=Object.entries(skillTags).sort(function(a,b){return b[1]-a[1];}).slice(0,30);
        var baseDist=Math.min(w,h)*0.38;
        function placeHub(list,hubKey,baseAngle,bd){
            var spread=Math.PI*0.5;
            list.forEach(function(item,i){
                var t=list.length>1?(i/(list.length-1))-0.5:0;
                var angle=baseAngle+t*spread;
                var dist=bd+(Math.random()-0.5)*bd*0.15;
                var tags=Array.isArray(item.tags)?item.tags:JSON.parse(item.tags||'[]');
                graphNodes.push({id:item.id,item:item,hub:hubKey,x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist,vx:0,vy:0,orbitRadius:dist,orbitAngle:angle,orbitSpeed:0.0002*(0.5+Math.random()*0.5)*(hubKey==='topics'?1:hubKey==='repos'?-1:0.5),radius:2.5+Math.min(item.content.length/500,2.5),color:HUB_COLORS[hubKey].main,_hidden:false,_glowPhase:Math.random()*Math.PI*2});
            });
        }
        placeHub(topics,'topics',Math.PI*0.85,baseDist);
        placeHub(repos,'repos',Math.PI*0.15,baseDist);
        topSkills.forEach(function(pair,i){
            var tag=pair[0],count=pair[1];
            var t=topSkills.length>1?(i/(topSkills.length-1))-0.5:0;
            var angle=Math.PI*0.5+t*Math.PI*0.4;
            var dist=baseDist+Math.random()*baseDist*0.1;
            graphNodes.push({id:'skill_'+tag,_isSkill:true,skillTag:tag,hub:'skills',item:{title:'#'+tag,content:tag,tags:[tag],item_type:'skill'},x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist,vx:0,vy:0,orbitRadius:dist,orbitAngle:angle,orbitSpeed:0.00015*(0.5+Math.random()*0.3),radius:2+Math.min(count*0.8,5),color:HUB_COLORS.skills.main,_hidden:false,_glowPhase:Math.random()*Math.PI*2});
        });
        // Hub labels
        [{id:'_hub_topics',label:'MY PROJECTS',x:cx+Math.cos(Math.PI*0.85)*baseDist*0.6,y:cy+Math.sin(Math.PI*0.85)*baseDist*0.6,color:HUB_COLORS.topics.main,hub:'topics'},
         {id:'_hub_repos',label:'REPOSITORIES',x:cx+Math.cos(Math.PI*0.15)*baseDist*0.6,y:cy+Math.sin(Math.PI*0.15)*baseDist*0.6,color:HUB_COLORS.repos.main,hub:'repos'},
         {id:'_hub_skills',label:'SKILLS',x:cx+Math.cos(Math.PI*0.5)*baseDist*0.6,y:cy+Math.sin(Math.PI*0.5)*baseDist*0.6,color:HUB_COLORS.skills.main,hub:'skills'}
        ].forEach(function(h){graphNodes.push({id:h.id,_isHubLabel:true,hub:h.hub,x:h.x,y:h.y,vx:0,vy:0,orbitRadius:0,orbitAngle:0,orbitSpeed:0,radius:0,color:h.color,label:h.label,_hidden:false,_glowPhase:0});});
        // Edges: items sharing tags
        var tagIdx={};
        graphNodes.forEach(function(n){if(n._isHubLabel||n._isSkill)return;var tags=Array.isArray(n.item.tags)?n.item.tags:JSON.parse(n.item.tags||'[]');tags.forEach(function(t){if(!tagIdx[t])tagIdx[t]=[];tagIdx[t].push(n.id);});});
        var edgeSet=new Set();
        Object.values(tagIdx).forEach(function(ids){for(var i=0;i<ids.length;i++){for(var j=i+1;j<ids.length;j++){var k=Math.min(ids[i],ids[j])+'-'+Math.max(ids[i],ids[j]);if(!edgeSet.has(k)){var n1=graphNodes.find(function(n){return n.id===ids[i];});var n2=graphNodes.find(function(n){return n.id===ids[j];});if(n1&&n2&&n1.hub===n2.hub){edgeSet.add(k);graphEdges.push({source:ids[i],target:ids[j],hub:n1.hub});}}}}});
        var ec={};
        graphEdges=graphEdges.filter(function(e){ec[e.source]=(ec[e.source]||0)+1;ec[e.target]=(ec[e.target]||0)+1;return ec[e.source]<=6&&ec[e.target]<=6;});
        // Sections from API
        apiFetch('/graph').then(function(d){graphSections=d.sections||[];renderSectionList();}).catch(function(){});
        startSim();
    }

    var simRunning=false;
    function startSim(){
        if(simRunning)return;
        simRunning=true;
        function tick(){simStep();render();renderMinimap();requestAnimationFrame(tick);}
        tick();
    }

    function simStep(){
        var nodes=graphNodes.filter(function(n){return !n._hidden&&!n._isHubLabel;});
        var cx=window.innerWidth/2,cy=window.innerHeight/2;
        nodes.forEach(function(n){
            if(n===dragNode)return;
            n.orbitAngle+=n.orbitSpeed*kRotSpeed;
            var tx=cx+Math.cos(n.orbitAngle)*n.orbitRadius;
            var ty=cy+Math.sin(n.orbitAngle)*n.orbitRadius;
            n.vx+=(tx-n.x)*cfg.orbitalForce;
            n.vy+=(ty-n.y)*cfg.orbitalForce;
        });
        for(var i=0;i<nodes.length;i++){for(var j=i+1;j<nodes.length;j++){if(nodes[i].hub!==nodes[j].hub)continue;var dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1;if(d<60){var f=cfg.repulsion/d2;nodes[i].vx-=(dx/d)*f;nodes[i].vy-=(dy/d)*f;nodes[j].vx+=(dx/d)*f;nodes[j].vy+=(dy/d)*f;}}}
        var nm={};nodes.forEach(function(n){nm[n.id]=n;});
        graphEdges.forEach(function(e){var s=nm[e.source],t=nm[e.target];if(!s||!t)return;var dx=t.x-s.x,dy=t.y-s.y,d=Math.sqrt(dx*dx+dy*dy)||1;var f=(d-cfg.linkDist)*0.003;s.vx+=(dx/d)*f;s.vy+=(dy/d)*f;t.vx-=(dx/d)*f;t.vy-=(dy/d)*f;});
        nodes.forEach(function(n){if(n===dragNode)return;n.vx*=cfg.damping;n.vy*=cfg.damping;n.x+=n.vx;n.y+=n.vy;});
    }

    function render(){
        var w=window.innerWidth,h=window.innerHeight,z=cfg.zoom,time=performance.now()*0.001;
        var canvas=document.getElementById('graphCanvas');
        var ctx=canvas.getContext('2d');
        var dpr=window.devicePixelRatio||1;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,w,h);
        // Dot grid
        ctx.fillStyle='rgba(255,255,255,0.012)';
        for(var x=0;x<w;x+=60)for(var y=0;y<h;y+=60){var jx=Math.sin((x+time*0.1)*0.012)*1;var jy=Math.cos((y+time*0.1)*0.012)*1;ctx.beginPath();ctx.arc(x+jx,y+jy,0.4,0,Math.PI*2);ctx.fill();}
        ctx.save();ctx.translate(w/2+cfg.panX,h/2+cfg.panY);ctx.scale(z,z);ctx.translate(-w/2,-h/2);
        var vn=graphNodes.filter(function(n){return !n._hidden;});var nm={};vn.forEach(function(n){nm[n.id]=n;});var cxc=w/2,cyc=h/2;
        // Hub labels
        vn.filter(function(n){return n._isHubLabel;}).forEach(function(n){ctx.font='bold 18px Inter,sans-serif';ctx.fillStyle=n.color;ctx.globalAlpha=0.7;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.label,n.x,n.y);ctx.globalAlpha=1;});
        // Edges
        graphEdges.forEach(function(e){var s=nm[e.source],t=nm[e.target];if(!s||!t)return;var hc=HUB_COLORS[e.hub]||HUB_COLORS.topics;ctx.strokeStyle=hc.main+'18';ctx.lineWidth=0.4;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(t.x,t.y);ctx.stroke();});
        // Core
        var coreR=28,corePulse=1+Math.sin(time*1.5)*0.08;
        var glow=ctx.createRadialGradient(cxc,cyc,0,cxc,cyc,coreR*4*corePulse);glow.addColorStop(0,'rgba(251,191,36,0.2)');glow.addColorStop(0.3,'rgba(251,191,36,0.08)');glow.addColorStop(1,'rgba(251,191,36,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cxc,cyc,coreR*4*corePulse,0,Math.PI*2);ctx.fill();
        var cg=ctx.createRadialGradient(cxc-4,cyc-6,2,cxc,cyc,coreR);cg.addColorStop(0,'#fde68a');cg.addColorStop(0.4,'#fbbf24');cg.addColorStop(1,'#b45309');ctx.fillStyle=cg;ctx.beginPath();ctx.moveTo(cxc,cyc-coreR);ctx.lineTo(cxc+coreR*0.7,cyc-coreR*0.2);ctx.lineTo(cxc+coreR*0.5,cyc+coreR*0.6);ctx.lineTo(cxc-coreR*0.5,cyc+coreR*0.6);ctx.lineTo(cxc-coreR*0.7,cyc-coreR*0.2);ctx.closePath();ctx.fill();
        var sp=ctx.createRadialGradient(cxc-5,cyc-8,1,cxc,cyc,coreR*0.8);sp.addColorStop(0,'rgba(255,255,255,0.4)');sp.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sp;ctx.beginPath();ctx.arc(cxc,cyc,coreR*0.8,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(251,191,36,0.3)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cxc,cyc,coreR+6,0,Math.PI*2);ctx.stroke();
        ctx.font='500 11px Inter,sans-serif';ctx.fillStyle='rgba(251,191,36,0.7)';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Knowledge Core',cxc,cyc+coreR+12);
        // Core-to-hub edges
        ['topics','repos','skills'].forEach(function(hk){var hn=vn.filter(function(n){return n.hub===hk&&!n._isHubLabel;});hn.slice(0,3).forEach(function(n){var hc=HUB_COLORS[hk];var grd=ctx.createLinearGradient(cxc,cyc,n.x,n.y);grd.addColorStop(0,'rgba(251,191,36,0.15)');grd.addColorStop(1,hc.main+'20');ctx.strokeStyle=grd;ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(cxc,cyc);ctx.lineTo(n.x,n.y);ctx.stroke();});});
        // Nodes
        vn.filter(function(n){return !n._isHubLabel;}).forEach(function(n){
            var isH=n===hoveredNode;var r=isH?n.radius*2.2:n.radius;var pulse=1+Math.sin(time*1.2+n._glowPhase)*0.1;var glowR=r*3.5*pulse*kGlow;
            var ng=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,glowR);var a=isH?0.35:0.08*kGlow;ng.addColorStop(0,n.color+hexA(a));ng.addColorStop(0.4,n.color+hexA(a*0.4));ng.addColorStop(1,n.color+'00');ctx.fillStyle=ng;ctx.beginPath();ctx.arc(n.x,n.y,glowR,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=isH?1:0.85;ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fillStyle=n.color;ctx.fill();ctx.globalAlpha=1;
            var sp2=ctx.createRadialGradient(n.x-r*0.2,n.y-r*0.2,0,n.x,n.y,r);sp2.addColorStop(0,'rgba(255,255,255,0.2)');sp2.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sp2;ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();
            if(isH&&n.item){var label=n.item.title||'';ctx.font='500 11px Inter,sans-serif';var tw=ctx.measureText(label).width+12;ctx.fillStyle='rgba(13,17,23,0.9)';roundRect(ctx,n.x-tw/2,n.y-r-22,tw,18,4);ctx.fill();ctx.fillStyle='#e6edf3';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label.substring(0,30),n.x,n.y-r-13);}
        });
        ctx.restore();
    }

    function renderMinimap(){
        var mm=document.getElementById('minimapCanvas'),mctx=mm.getContext('2d'),mw=320,mh=220;
        mctx.clearRect(0,0,mw,mh);mctx.fillStyle='rgba(13,17,23,0.95)';mctx.fillRect(0,0,mw,mh);
        var nodes=graphNodes.filter(function(n){return !n._hidden;});if(!nodes.length)return;
        var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
        nodes.forEach(function(n){minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y);});
        var pad=40;minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;
        var s=Math.min((mw-8)/(maxX-minX||1),(mh-8)/(maxY-minY||1));
        nodes.forEach(function(n){var mx=4+(n.x-minX)*s,my=4+(n.y-minY)*s;mctx.beginPath();mctx.arc(mx,my,1.2,0,Math.PI*2);mctx.fillStyle=n.color+'60';mctx.fill();});
    }

    function s2w(sx,sy){var w=window.innerWidth,h=window.innerHeight,z=cfg.zoom;return{x:(sx-w/2-cfg.panX)/z+w/2,y:(sy-h/2-cfg.panY)/z+h/2};}
    function findNodeAt(wx,wy){var v=graphNodes.filter(function(n){return !n._hidden&&!n._isHubLabel;});for(var i=v.length-1;i>=0;i--){var n=v[i],dx=wx-n.x,dy=wy-n.y,cr=Math.max(n.radius,5)+5;if(dx*dx+dy*dy<cr*cr)return n;}return null;}

    // Events
    var canvas=document.getElementById('graphCanvas');
    canvas.addEventListener('mousedown',function(e){var w=s2w(e.clientX,e.clientY),n=findNodeAt(w.x,w.y);mouseDownPos={x:e.clientX,y:e.clientY};didDrag=false;if(n)dragNode=n;else lastMouse={x:e.clientX,y:e.clientY};isDragging=true;});
    canvas.addEventListener('mousemove',function(e){var w=s2w(e.clientX,e.clientY);if(mouseDownPos){var dx=e.clientX-mouseDownPos.x,dy=e.clientY-mouseDownPos.y;if(dx*dx+dy*dy>16)didDrag=true;}if(dragNode&&isDragging&&didDrag){dragNode.x=w.x;dragNode.y=w.y;dragNode.vx=0;dragNode.vy=0;}else if(isDragging&&!dragNode&&didDrag){cfg.panX+=e.clientX-lastMouse.x;cfg.panY+=e.clientY-lastMouse.y;lastMouse={x:e.clientX,y:e.clientY};}else{var n=findNodeAt(w.x,w.y);if(n!==hoveredNode){hoveredNode=n;canvas.style.cursor=n?'pointer':'grab';}}});
    canvas.addEventListener('mouseup',function(e){var w=s2w(e.clientX,e.clientY),n=findNodeAt(w.x,w.y);if(n&&!didDrag)showNodeSidebar(n);else if(!n&&!didDrag)closeSidebar();dragNode=null;isDragging=false;mouseDownPos=null;});
    canvas.addEventListener('wheel',function(e){e.preventDefault();cfg.zoom=Math.max(0.1,Math.min(5,cfg.zoom*(e.deltaY>0?0.92:1.08)));},{passive:false});

    // Sidebar
    var TYPE_COLORS={note:'#4ade80',code:'#22d3ee',task:'#f87171',bookmark:'#fbbf24',skill:'#fbbf24'};
    var TYPE_ICONS={note:'\u{1F4DD}',code:'\u{1F4BB}',task:'\u2705',bookmark:'\u{1F516}',skill:'\u2B50'};
    var HUB_LABELS={topics:'My Projects',repos:'Repositories',skills:'Skills'};

        var tags=Array.isArray(item.tags)?item.tags:JSON.parse(item.tags||'[]');
        var type=item.item_type||node.hub||'note';

        var icon=TYPE_ICONS[type]||'\u{1F4C4}';

        var content=item.content||'';
        var isLong=content.length>200;
        var related=allItems.filter(function(i){
            if(i.id===item.id)return false;
            var t=Array.isArray(i.tags)?i.tags:JSON.parse(i.tags||'[]');
            return tags.some(function(tag){return t.indexOf(tag)>=0;});
        }).slice(0,5);

        var safeTitle=esc(item.title||'Untitled');

        html+='</div></div>';

        html+='<div class="panel-section"><div class="panel-section-title">Content</div>';
        html+='<div class="panel-item-content'+(isLong?' truncated':'')+'" id="sidebarContent">'+safeContent+'</div>';
        if(isLong) html+='<button class="panel-expand-btn" onclick="toggleContentExpand()">Show more \u2193</button>';
        html+='</div>';

        html+='<div class="panel-section"><div class="panel-section-title">Tags</div><div class="panel-tags">';

                html+='<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((r.title||'').substring(0,35))+'</span>';
                html+='<span class="panel-section-count">'+esc(r.item_type)+'</span>';
                html+='</div>';

        document.getElementById('panelDetail').innerHTML=html;

            el.addEventListener('click',function(){showToast('Tag: '+el.dataset.tag);});

    function showNodeById(id){var n=graphNodes.find(function(x){return x.id===id;});if(n)showNodeSidebar(n);}

    function zoomIn(){cfg.zoom=Math.min(5,cfg.zoom*1.3);}
    function zoomOut(){cfg.zoom=Math.max(0.1,cfg.zoom*0.7);}
    function fitAll(){
        if(!graphNodes.length){cfg.zoom=1;cfg.panX=0;cfg.panY=0;return;}
        var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
        graphNodes.forEach(function(n){if(n.radius>0){minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y);}});
        var w=window.innerWidth,h=window.innerHeight,pad=60;
        var nw=maxX-minX+pad*2,nh=maxY-minY+pad*2;
        var z=Math.min(w/nw,h/nh);
        cfg.zoom=Math.max(0.15,Math.min(z,1.0));
        var cx=(minX+maxX)/2,cy=(minY+maxY)/2;
        cfg.panX=(w/2-cx)*cfg.zoom;
        cfg.panY=(h/2-cy)*cfg.zoom;
    }
    function togglePanel(){var p=document.getElementById('sidePanel');if(!p.classList.contains('open')){showPanelTab('sections',document.getElementById('tabSections'));p.classList.add('open');}else{p.classList.remove('open');}}

    // Physics controls
    function togglePhysics(){var p=document.getElementById('physicsPanel');p.style.display=p.style.display==='none'?'block':'none';}
    function kSetRotation(v){kRotSpeed=parseFloat(v);document.getElementById('kRotVal').textContent=parseFloat(v).toFixed(1)+'\u00D7';}
    function kSetSpread(v){kSpread=parseFloat(v);document.getElementById('kSpreadVal').textContent=parseFloat(v).toFixed(1)+'\u00D7';
        var w=window.innerWidth,h=window.innerHeight;var bd=Math.min(w,h)*0.38*kSpread;
        graphNodes.forEach(function(n){if(n._isHubLabel)return;n.orbitRadius=bd+(Math.random()-0.5)*bd*0.15;});
    }
    function kSetGlow(v){kGlow=parseFloat(v);document.getElementById('kGlowVal').textContent=parseFloat(v).toFixed(1)+'\u00D7';}

    function renderSectionList(){
        var body=document.getElementById('panelSections');if(!body)return;
        if(!graphSections.length){body.innerHTML='<div class="panel-empty"><div class="icon">\u{1F4C2}</div><p>No sections found</p></div>';return;}
        var html='<div class="panel-section"><div class="panel-section-title">Graph Sections</div><div class="panel-sections-list">';
        graphSections.forEach(function(sec,i){
            html+='<div class="panel-section-item" data-sec-idx="'+i+'"><div class="panel-section-dot" style="background:'+sec.color+'"></div><span>'+esc(sec.heading)+'</span><span class="panel-section-count">'+sec.count+'</span></div>';
        });

        body.innerHTML=html;

    function highlightSection(idx){
        var sec=graphSections[idx];if(!sec)return;
        var nodeIds=new Set(sec.node_ids);
        graphNodes.forEach(function(n){n._hidden=!nodeIds.has(n.id)&&!n._isHubLabel;});
        showToast('Showing: '+sec.heading+' ('+sec.count+' items)');
    }

    function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
    function hexA(a){return Math.round(Math.min(1,Math.max(0,a))*255).toString(16).padStart(2,'0');}
    function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

    function startClock(){var u=function(){var n=new Date(),mo=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];document.getElementById('topTime').textContent=n.getDate().toString().padStart(2,'0')+' '+mo[n.getMonth()]+' '+n.getFullYear()+' | '+n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+' PST';};u();setInterval(u,30000);}

    var toastTimer;
    function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2000);}

    document.addEventListener('click',function(e){if(!e.target.closest('.side-panel')&&!e.target.closest('#graphCanvas')&&!e.target.closest('.ctrl-btn')&&!e.target.closest('.panel-tag'))closeSidebar();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSidebar();});
    window.addEventListener('resize',function(){setupCanvas();});

    setupCanvas();
    checkAuth();
    window.addEventListener('load',function(){
        setupCanvas();
        if(graphNodes.length) fitAll();
    });
    </script>
</body>
</html>
