<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills — Second Brain</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0d1117;--surface:#161b22;--border:rgba(255,255,255,0.06);--text:#e6edf3;--text-dim:#7d8590;--accent:#8b5cf6;--sidebar-w:56px;--topbar-h:52px}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow-y:auto}
        .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100%;background:rgba(13,17,23,0.95);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;z-index:100}
        .sidebar-top{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
        .sidebar-bottom{display:flex;flex-direction:column;align-items:center;gap:4px}
        .sb-logo{width:32px;height:32px;margin-bottom:12px;background:linear-gradient(135deg,#8b5cf6,#a78bfa,#c4b5fd);clip-path:polygon(50% 0%,85% 25%,85% 75%,50% 100%,15% 75%,15% 25%)}
        .sb-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);transition:all 0.2s;border:none;background:none;position:relative;text-decoration:none}
        .sb-icon:hover{color:var(--text);background:rgba(255,255,255,0.04)}
        .sb-icon.active{color:var(--accent)}
        .sb-icon.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0}
        .sb-divider{width:24px;height:1px;background:var(--border);margin:6px 0}
        .sb-profile{width:36px;height:36px;border-radius:50%;position:relative;cursor:pointer;margin-top:8px}
        .sb-profile::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,#8b5cf6,#a78bfa,#8b5cf6);z-index:-1;animation:spin 4s linear infinite}
        .sb-profile-inner{width:100%;height:100%;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px}
        .sb-profile-label{font-size:8px;font-weight:700;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;text-align:center}
        @keyframes spin{to{transform:rotate(360deg)}}
        .topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:rgba(13,17,23,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:90}
        .topbar-tabs{display:flex;gap:24px;margin-right:24px}
        .tab-btn{font-size:14px;font-weight:600;color:var(--text-dim);cursor:pointer;background:none;border:none;padding:6px 0;position:relative;text-decoration:none}
        .tab-btn.active{color:var(--text)}
        .tab-btn.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--text);border-radius:1px}
        
        .search-box { flex: 1; max-width: 320px; position: relative; }
        .search-box input { width: 100%; padding: 7px 12px 7px 32px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; outline: none; }
        .search-box input:focus { border-color: rgba(139,92,246,0.4); }
        .search-box input::placeholder { color: var(--text-dim); }
        .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-dim); }
        .topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
        .topbar-time{font-size:12px;color:var(--text-dim);font-weight:500;letter-spacing:0.04em}
        .main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:24px 28px}
        .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
        .page-header h1{font-size:24px;font-weight:700}
        .skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px}
        .skill-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.2s}
        .skill-card:hover{border-color:rgba(139,92,246,0.3);transform:translateY(-2px)}
        .skill-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
        .skill-badge{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .skill-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
        .skill-name{font-size:14px;font-weight:600}
        .skill-count{font-size:11px;color:var(--text-dim)}
        .skill-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:8px;overflow:hidden}
        .skill-bar-fill{height:100%;border-radius:2px}
        .detail-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;display:none}
        .detail-panel.visible{display:block}
        .detail-header{display:flex;gap:16px;align-items:start;margin-bottom:20px}
        .detail-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px}
        .detail-title{font-size:20px;font-weight:700;margin-bottom:4px}
        .detail-subtitle{font-size:13px;color:var(--text-dim)}
        .detail-section{margin-bottom:20px}
        .detail-section h3{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:10px}
        .linked-list{display:flex;flex-direction:column;gap:6px}
        .linked-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;transition:all 0.15s}
        .linked-item:hover{background:rgba(255,255,255,0.04);border-color:rgba(139,92,246,0.2)}
        .linked-item .time{font-size:11px;color:var(--text-dim)}
        .radar-container{width:100%;max-width:300px;margin:0 auto}
        .radar-container canvas{width:100%!important;height:auto!important}
    
        .chat-panel { position: fixed; top: var(--topbar-h); right: -400px; width: 400px; bottom: 0; background: rgba(13,17,23,0.95); backdrop-filter: blur(16px); border-left: 1px solid var(--border); z-index: 90; display: flex; flex-direction: column; transition: right 0.3s; }
        .chat-panel.open { right: 0; }
        .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { font-size: 13px; font-weight: 600; }
        .chat-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 13px; line-height: 1.5; padding: 8px 12px; border-radius: 8px; max-width: 90%; }
        .chat-msg.user { background: rgba(139,92,246,0.15); align-self: flex-end; border: 1px solid rgba(139,92,246,0.2); }
        .chat-msg.assistant { background: rgba(255,255,255,0.03); align-self: flex-start; border: 1px solid var(--border); }
        .chat-input-area { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; }
        .chat-input-area button { padding: 8px 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; }
    </style>
</head>

    <script>
    const API_URL=window.location.origin+'/api/v1';
    let apiKey=localStorage.getItem('brain_api_key')||'';
    let allItems=[],skillData={};

        // ── Search ──
    var searchTimer;
    function handleSearch(q) {
        clearTimeout(searchTimer);
        if (!q.trim()) return;
        searchTimer = setTimeout(function() {
            window.location.href = '/browser?search=' + encodeURIComponent(q);
        }, 800);
    }

    function startTimeClock(){const u=()=>{const n=new Date(),mo=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];document.getElementById('topTime').textContent=n.getDate().toString().padStart(2,'0')+' '+mo[n.getMonth()]+' '+n.getFullYear()+' | '+n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+' PST'};u();setInterval(u,30000)}

    async function loadData(){
        if(!apiKey){apiKey=prompt('Enter API key:');if(!apiKey)return;localStorage.setItem('brain_api_key',apiKey)}
        try{
            const res=await fetch(API_URL+'/items?limit=200',{headers:{'X-API-Key':apiKey}});
            if(!res.ok)throw new Error();
            allItems=await res.json();
            buildSkillData();
            renderSkills();
        }catch(e){document.getElementById('skillsGrid').innerHTML='<div style="color:#f87171">Failed to load</div>'}
    }

    function buildSkillData(){
        skillData={};
        allItems.forEach(item=>{
            const tags=Array.isArray(item.tags)?item.tags:JSON.parse(item.tags||'[]');
            tags.forEach(t=>{
                if(!skillData[t])skillData[t]={count:0,items:[],type:'general'};
                skillData[t].count++;
                skillData[t].items.push(item);
            });
        });
        // Tag skill types
        Object.keys(skillData).forEach(k=>{
            const s=skillData[k];
            if(['python','rust','go','java','c++','typescript','javascript','kotlin','swift','elixir','ruby','lua','scala','php','dart','shell','zig'].includes(k))s.type='language';
            else if(['react','vue','svelte','nextjs','css','web-ui','frontend','tailwind'].includes(k))s.type='framework';
            else if(['ai','machine-learning','llm','ollama','gemini','claude-code','multi-agent'].includes(k))s.type='ai';
            else if(['docker','aws','devops','microservices','architecture'].includes(k))s.type='infra';
            else if(['neovim','fzf','cli','magisk','developer-tools'].includes(k))s.type='tool';
        });
    }

    const SKILL_COLORS={language:'#4ade80',framework:'#a78bfa',ai:'#fbbf24',infra:'#f87171',tool:'#22d3ee',general:'#7d8590'};
    const SKILL_ICONS={language:'🔤',framework:'🎨',ai:'🤖',infra:'☁️',tool:'🔧',general:'📌'};

    function renderSkills(){
        const sorted=Object.entries(skillData).sort((a,b)=>b[1].count-a[1].count).slice(0,30);
        const grid=document.getElementById('skillsGrid');
        grid.innerHTML=sorted.map(([name,data])=>{
            const color=SKILL_COLORS[data.type];
            const maxCount=sorted[0][1].count;
            const pct=Math.round(data.count/maxCount*100);
            return '<div class="skill-card" onclick="selectSkill(\''+esc(name)+'\')">'+
                '<div class="skill-badge">'+
                    '<div class="skill-icon" style="background:'+color+'15">'+SKILL_ICONS[data.type]+'</div>'+
                    '<div><div class="skill-name">#'+esc(name)+'</div><div class="skill-count">'+data.count+' items · '+data.type+'</div></div>'+
                '</div>'+
                '<div class="skill-bar"><div class="skill-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
            '</div>';
        }).join('');
    }

    function selectSkill(name){
        document.querySelectorAll('.skill-card').forEach(c=>c.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        const data=skillData[name];
        const color=SKILL_COLORS[data.type];
        document.getElementById('detailPanel').classList.add('visible');
        document.getElementById('detailIcon').style.background=color+'15';
        document.getElementById('detailIcon').textContent=SKILL_ICONS[data.type];
        document.getElementById('detailTitle').textContent='#'+name;
        document.getElementById('detailSubtitle').textContent=data.count+' items using this skill · '+data.type;
        document.getElementById('linkedProjects').innerHTML=data.items.slice(0,8).map(item=>
            '<div class="linked-item" onclick="window.location.href=\'/repo/'+item.id+'\'">'+
                '<span>'+esc(item.title.substring(0,35))+'</span>'+
                '<span class="time">'+item.item_type+'</span>'+
            '</div>'
        ).join('');
        drawRadar(name,data);
    }

    function drawRadar(name,data){
        const canvas=document.getElementById('radarCanvas');
        const ctx=canvas.getContext('2d');
        const w=300,h=300,cx=w/2,cy=h/2,r=100;
        ctx.clearRect(0,0,w,h);
        const dims=['Count','Variety','Recency','Depth',' breadth'];
        const vals=[Math.min(1,data.count/10),Math.min(1,data.items.length/5),0.7+Math.random()*0.3,Math.min(1,data.count/8),Math.min(1,new Set(data.items.map(i=>i.item_type)).size/3)];
        const n=dims.length;
        // Draw grid
        for(let ring=1;ring<=4;ring++){
            ctx.beginPath();
            for(let i=0;i<=n;i++){
                const angle=(Math.PI*2*i/n)-Math.PI/2;
                const x=cx+Math.cos(angle)*r*(ring/4);
                const y=cy+Math.sin(angle)*r*(ring/4);
                i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            }
            ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.stroke();
        }
        // Draw axes
        for(let i=0;i<n;i++){
            const angle=(Math.PI*2*i/n)-Math.PI/2;
            ctx.beginPath();ctx.moveTo(cx,cy);
            ctx.lineTo(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);
            ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.stroke();
            // Labels
            const lx=cx+Math.cos(angle)*(r+18);
            const ly=cy+Math.sin(angle)*(r+18);
            ctx.font='11px Inter';ctx.fillStyle='#7d8590';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText(dims[i],lx,ly);
        }
        // Draw data
        ctx.beginPath();
        for(let i=0;i<=n;i++){
            const idx=i%n;
            const angle=(Math.PI*2*idx/n)-Math.PI/2;
            const x=cx+Math.cos(angle)*r*vals[idx];
            const y=cy+Math.sin(angle)*r*vals[idx];
            i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.fillStyle=SKILL_COLORS[data.type]+'25';ctx.fill();
        ctx.strokeStyle=SKILL_COLORS[data.type];ctx.lineWidth=2;ctx.stroke();
        // Draw points
        for(let i=0;i<n;i++){
            const angle=(Math.PI*2*i/n)-Math.PI/2;
            const x=cx+Math.cos(angle)*r*vals[i];
            const y=cy+Math.sin(angle)*r*vals[i];
            ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=SKILL_COLORS[data.type];ctx.fill();
            ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
        }
    }

    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    startTimeClock();loadData();
    
    var chatHistory = JSON.parse(localStorage.getItem('brain_chat_history') || '[]'); if (!Array.isArray(chatHistory)) chatHistory = [];
    function toggleChat() { document.getElementById('chatPanel').classList.toggle('open'); }
    async function sendChat() {
        var input = document.getElementById('chatInput'), msg = input.value.trim();
        if (!msg) return; input.value = '';
        var ml = document.getElementById('chatMessages');
        ml.innerHTML += '<div class="chat-msg user">' + esc(msg) + '</div>';
        var tid = 't-' + Date.now();
        ml.innerHTML += '<div class="chat-msg assistant" id="' + tid + '">Thinking...</div>';
        ml.scrollTop = ml.scrollHeight;
        try {
            var _apiKey = localStorage.getItem('brain_api_key') || '';
            var _headers = {'Content-Type': 'application/json'};
            if (_apiKey) _headers['X-API-Key'] = _apiKey;
            var r = await fetch(window.location.origin + '/api/v1/chat', { method: 'POST', headers: _headers, body: JSON.stringify({ message: msg, history: chatHistory }) });
            document.getElementById(tid).innerHTML = esc(r.reply);
            chatHistory.push({ role: 'user', parts: [msg] }); chatHistory.push({ role: 'model', parts: [r.reply] });
            if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
            localStorage.setItem('brain_chat_history', JSON.stringify(chatHistory));
        } catch(e) { document.getElementById(tid).innerHTML = '<span style="color:#f87171">' + esc(e.message) + '</span>'; }
        ml.scrollTop = ml.scrollHeight;
    }

    
    document.addEventListener('click', function(e) {
        var cp = document.getElementById('chatPanel');
        if (cp && cp.classList.contains('open') && !e.target.closest('.chat-panel') && !e.target.closest('[onclick*="toggleChat"]')) {
            cp.classList.remove('open');
        }
    });
    </script>
</body>
</html>
